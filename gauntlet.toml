# agent-gauntlet configuration for python
stack = "python"
save_evidence = true
evidence_file = "evidence.json"
evidence_markdown_file = "evidence.md"

[paths]
tasks_dir = "tasks"
spec_file = "spec.md"
context_file = "CONTEXT.md"
coding_standards_file = "CODING_STANDARDS.md"

[[layers]]
name = "lint"
command = ["python3", "-m", "ruff", "check", "."]
optional = true
timeout_seconds = 30.0

[[layers]]
name = "types"
command = ["python3", "-m", "pyright", "src", "tests", "tools"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "unit"
command = ["python3", "-m", "unittest", "discover", "tests"]
optional = false
timeout_seconds = 60.0

[[layers]]
name = "rust"
command = ["cargo", "test", "--manifest-path", "crates/gauntlet-policy-engine/Cargo.toml"]
optional = false
timeout_seconds = 30.0

[[layers]]
name = "invariants"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "*propert*.py"]
optional = true
timeout_seconds = 60.0

[[layers]]
name = "mutation-testing-gauntlet"
command = ["python3", "tools/mutants.py"]
optional = true
timeout_seconds = 120.0
