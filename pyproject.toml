[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gauntlet"
version = "0.2.0"
description = "Universal multi-stack verification gauntlet & tamper-proof evidence authority for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-gauntlet = "agent_gauntlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
