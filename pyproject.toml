[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gauntlet"
version = "0.8.1"
description = "Universal multi-stack verification gauntlet & tamper-proof evidence authority for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0.0",
    'tomli>=1.1.0; python_version < "3.11"',
]


[project.optional-dependencies]
dev = [
    "pyright>=1.1.300",
    "ruff>=0.4.0",
]

[project.scripts]
agent-gauntlet = "agent_gauntlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_gauntlet = ["templates/**/*", "templates/**/**/*", "templates/**/**/**/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

