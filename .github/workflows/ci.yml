name: CI & Attestation Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Gauntlet (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install agent-gauntlet with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Multi-Layer Gauntlet
        run: |
          sh tools/gauntlet.sh

      - name: Verify Clean Workspace (No Test Mutation Artifacts)
        run: |
          git diff --exit-code

      - name: Generate Unsigned Verification Report
        run: |
          agent-gauntlet verify --task-id 023-p0-audit-remediation-and-cryptographic-attestation

      - name: Upload Verification Report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: verification-report
          path: verification-report.json
          retention-days: 7

  attest:
    name: Attest Verification Report (Sigstore OIDC)
    needs: [verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download Verification Report
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: verification-report

      - name: Validate Report Integrity
        run: |
          python3 -c "
          import json, sys
          with open('verification-report.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print('=== Downloaded Verification Report ===')
          print(json.dumps(data, indent=2))
          print('=====================================')
          if data.get('verdict') != 'PASSED':
              print(f'Error: Verdict is {data.get(\"verdict\")}', file=sys.stderr)
              sys.exit(1)
          if data.get('schema_version') != '2.0.0':
              print(f'Error: Schema version {data.get(\"schema_version\")}', file=sys.stderr)
              sys.exit(1)

          contract = data.get('task_contract', {})
          if not contract.get('acceptance_criteria') or len(contract.get('acceptance_criteria')) == 0:
              print('Error: Task contract has 0 acceptance criteria', file=sys.stderr)
              sys.exit(1)
          if contract.get('unresolved_criteria'):
              print(f'Error: Task contract has unresolved criteria: {contract.get(\"unresolved_criteria\")}', file=sys.stderr)
              sys.exit(1)

          checks = data.get('checks', [])
          if not checks or len(checks) == 0:
              print('Error: Verification report has 0 checks', file=sys.stderr)
              sys.exit(1)
          for c in checks:
              if not c.get('optional', False):
                  if c.get('status') != 'PASSED' or c.get('exit_code', 1) != 0 or c.get('passed') is False:
                      print(f'Error: Mandatory check {c.get(\"name\")} failed: {c}', file=sys.stderr)
                      sys.exit(1)

          ws_state = data.get('workspace_state', {})
          for digest_key in ('source_manifest_digest_post', 'policy_digest', 'config_digest', 'task_digest'):
              if not ws_state.get(digest_key):
                  print(f'Error: Workspace state missing mandatory {digest_key}', file=sys.stderr)
                  sys.exit(1)

          print('Verification report schema, contract, checks, digests, and verdict validated successfully.')
          "

      - name: Attest Verification Report
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verification-report.json
          predicate-type: https://agent-gauntlet.dev/attestation/v1
          predicate-path: verification-report.json

      - name: Cryptographic Verification via Official CLI (GitHub Sigstore Root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify verification-report.json \
            --repo "${{ github.repository }}" \
            --predicate-type "https://agent-gauntlet.dev/attestation/v1"

  publish-npm:
    name: Publish to NPM Registry
    needs: [verify, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install agent-gauntlet
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Release Gatekeeper
        run: |
          agent-gauntlet check-release

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@agent-gauntlet"

      - name: Publish NPM Package (@agent-gauntlet/cli)
        working-directory: ./packages/agent-gauntlet
        run: |
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


